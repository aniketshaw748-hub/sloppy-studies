<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sloppy Studies</title>
<meta name="description" content="Sloppy Studies: CA2 exam answers as short, swipeable reels.">
<meta property="og:title" content="Sloppy Studies">
<meta name="author" content="Aniket Shaw">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.72);--glass:rgba(20,20,24,.55);--accent:#ff3b5c;
  --se:#D9654F;--cd:#2BD97A;--oop:#FFD23F;--im:#E63B2E;--ai:#A78BFA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.35 Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
#feed,#home{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* Layout: top bar | video stage | dock. The video is always shown whole (contain): these shorts carry
   diagrams edge to edge, so nothing is cropped and no control sits on top of the picture. */
:root{--topH:calc(env(safe-area-inset-top,0px) + 50px);--dockH:calc(env(safe-area-inset-bottom,0px) + 104px)}
#app{position:fixed;inset:0;display:flex;justify-content:center;background:#000}
#feed{position:absolute;top:var(--topH);bottom:0;width:100%;max-width:max(min(100vw,380px),min(100vw,560px,calc((100dvh - var(--topH) - var(--dockH)) * 9 / 16 + 24px)));overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.reel{height:calc(100dvh - var(--topH));scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#000;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.dock{height:var(--dockH);flex:none;display:flex;gap:10px;align-items:flex-start;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 8px);border-top:1px solid #151515;position:relative}
.top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:max(360px,min(100vw,560px,calc((100dvh - var(--topH) - var(--dockH)) * 9 / 16 + 24px)));height:var(--topH);z-index:5;display:flex;gap:6px;align-items:flex-end;
  padding:env(safe-area-inset-top,0px) 12px 8px;background:#000}
.tabscroll{flex:1;min-width:0;display:flex;gap:6px;align-items:flex-end;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tabscroll::-webkit-scrollbar{display:none}
.ctl{flex:none;display:flex;gap:6px;align-self:center;padding-left:6px}
.brand{white-space:nowrap;align-self:center;font-weight:800;font-size:15px;letter-spacing:-.2px;margin-right:4px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.brand small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.2px;color:var(--dim);margin-top:1px}
.mute{flex:none;width:40px;height:40px;border-radius:50%;background:#1b1b1f;display:grid;place-items:center}
.mute svg{width:18px;height:18px}
.tab{white-space:nowrap;padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--dim);background:rgba(255,255,255,.08);backdrop-filter:blur(8px)}
.tab[aria-pressed=true]{color:#000;background:#fff}
.rail{display:flex;gap:10px;align-items:flex-start;flex:none}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim);width:46px;min-height:44px;padding-top:2px}
@media (max-width:380px){.rb{width:42px}.rail{gap:6px}.dock{gap:8px;padding-left:10px;padding-right:8px}}
.rb svg{width:26px;height:26px}
.rb.cmt{width:54px}
.rb.on .heart{fill:var(--accent);stroke:var(--accent)}
.info{flex:1;min-width:0}
.who{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#000;flex:none}
.title{font-weight:800;font-size:15px;line-height:1.2;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q{color:var(--dim);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.q.open{-webkit-line-clamp:unset}
.bar{position:absolute;left:0;right:0;top:-11px;height:22px;z-index:4;cursor:pointer;touch-action:none}
.bar::before{content:"";position:absolute;left:0;right:0;top:10px;height:3px;background:rgba(255,255,255,.18);transition:height .12s,top .12s}
.bar:hover::before,.bar.drag::before{top:8px;height:6px}
.bar i{position:absolute!important;left:0;top:10px;transition:height .12s,top .12s}
.bar:hover i,.bar.drag i{top:8px;height:6px!important}
.bar b{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;opacity:0;transition:opacity .12s;pointer-events:none}
.bar:hover b,.bar.drag b{opacity:1}
.bar em{position:absolute;bottom:22px;transform:translateX(-50%);font-style:normal;font-weight:700;font-size:12px;background:rgba(0,0,0,.75);padding:3px 7px;border-radius:6px;opacity:0;pointer-events:none;white-space:nowrap}
.bar.drag em{opacity:1}
.bar i{display:block;height:3px;width:0;background:#fff}
.burst{position:absolute;width:110px;height:110px;pointer-events:none;z-index:6;animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-120%) scale(1);opacity:0}}
.paused{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2;opacity:0;transition:opacity .15s}
.paused.show{opacity:1}
.paused svg{width:84px;height:84px;opacity:.85}
.soundpill{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;display:flex;gap:8px;align-items:center;padding:10px 16px;border-radius:999px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-weight:700;font-size:14px}
.soundpill svg{width:20px;height:20px}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:min(100vw,calc(100dvh*9/16));max-height:72dvh;overflow:auto;z-index:20;
  background:#141418;border-radius:18px 18px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 22px);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:3px;background:#444;margin:4px auto 14px}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .sq{color:var(--dim);margin:0 0 14px}
.sheet ol{margin:0;padding-left:20px}
.sheet li{margin:0 0 10px;line-height:1.45}
/* feedback sheet (Comment button): the video pauses and the note is tagged with that moment, frame.io style */
.csheet h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tc{font-size:13px;font-weight:800;color:#000;background:#fff;border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.csheet textarea{display:block;width:100%;min-height:96px;resize:none;font:16px/1.4 Inter,system-ui,sans-serif;color:#fff;background:#1f1f25;border:1.5px solid #2e2e36;border-radius:12px;padding:10px 12px;outline:none}
.csheet textarea:focus{border-color:#8a8a96}
.crow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.crow small{color:var(--dim);font-size:12px;line-height:1.3}
.csend{flex:none;background:var(--accent);color:#fff;font-weight:800;padding:10px 20px;border-radius:999px}
.csend:disabled{opacity:.45}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(30,30,34,.92);padding:10px 16px;border-radius:10px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:600;white-space:nowrap}
.toast.show{opacity:1}
.empty{height:100dvh;display:grid;place-items:center;color:var(--dim);text-align:center;padding:24px}
@media (min-width:700px){#feed{border-left:1px solid #111;border-right:1px solid #111}}
/* Home: a student's sticker-covered notebook. It explains itself at a glance: hero line, a live reel in a phone,
   three steps, then the subject stickers. The feed opens on top as a history entry, so Back returns here. */
#home{position:fixed;inset:0;overflow-y:auto;z-index:8;color:#141414;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 40px);
  background:#FFF3D1 radial-gradient(#e7d6a8 1.2px,transparent 1.3px) 0 0/22px 22px;font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif}
.hwrap{max-width:1040px;margin:0 auto}
.hnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.gh{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;color:#141414;text-decoration:none;background:#fff;border:2.5px solid #141414;border-radius:999px;padding:6px 12px 6px 9px;box-shadow:3px 3px 0 #141414;transform:rotate(2deg);transition:transform .15s,box-shadow .15s}
.gh svg{width:17px;height:17px}.gh .st{color:#FFB800;font-size:15px;line-height:1;-webkit-text-stroke:1px #141414}
.gh:active{transform:translate(2px,2px) rotate(2deg);box-shadow:1px 1px 0 #141414}
.logo{font-weight:800;font-size:16px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.logo .blob{width:26px;height:26px;border-radius:9px;background:#FF4D8D;border:2.5px solid #141414;box-shadow:3px 3px 0 #141414;display:grid;place-items:center;transform:rotate(-8deg)}
.logo .blob svg{width:17px;height:17px}
.logo small{display:block;font-family:Caveat,cursive;font-size:15px;font-weight:700;color:#5b4b2a;margin-top:-4px;letter-spacing:0}
.hero{display:grid;grid-template-columns:1fr;gap:26px;align-items:center}
.pill{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:12.5px;background:#C6F432;border:2px solid #141414;border-radius:999px;padding:5px 11px;box-shadow:2px 2px 0 #141414;transform:rotate(-2deg)}
.h1{font-weight:800;font-size:clamp(44px,13.2vw,84px);line-height:.94;letter-spacing:-2px;margin:10px 0 0;max-width:900px}
.h1 .mark{position:relative;white-space:nowrap;z-index:0}
.h1 .mark::after{content:"";position:absolute;left:-4px;right:-6px;bottom:.06em;height:.36em;background:#FF4D8D;border-radius:6px;z-index:-1;transform:rotate(-1.5deg)}
.h1 .scrolly{color:#2F6BFF}
.lede{font-size:16.5px;line-height:1.45;color:#3d3423;max-width:520px;margin:0 0 20px}
.cta{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:17px;background:#141414;color:#FFF3D1;border-radius:14px;padding:14px 20px;box-shadow:5px 5px 0 #FF4D8D;transition:transform .12s,box-shadow .12s}
.cta:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #FF4D8D}.cta:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #FF4D8D}
.cta svg{width:20px;height:20px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.stat{font-weight:700;font-size:13px;background:#fff;border:2px solid #141414;border-radius:10px;padding:6px 10px}
.stat b{font-size:15px}
.phone{justify-self:center;position:relative;width:min(250px,64vw);aspect-ratio:9/18.5;background:#141414;border-radius:36px;padding:10px;box-shadow:8px 8px 0 #2F6BFF;transform:rotate(3deg)}
.phone::before{content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);width:70px;height:18px;background:#141414;border-radius:12px;z-index:2}
.phone video{width:100%;height:100%;object-fit:contain;border-radius:27px;background:#000;display:block}
.tape{position:absolute;width:86px;height:26px;background:rgba(255,214,90,.85);border:1.5px solid rgba(20,20,20,.25);top:-12px;left:-18px;transform:rotate(-32deg);z-index:3}
.note{position:absolute;right:-18px;bottom:56px;font-family:Caveat,cursive;font-weight:700;font-size:21px;line-height:1;background:#fff;border:2px solid #141414;border-radius:10px;padding:6px 9px;transform:rotate(-6deg);box-shadow:3px 3px 0 #141414;z-index:3}
.steps{display:grid;grid-template-columns:1fr;gap:10px;margin:34px 0 8px}
.step{display:flex;gap:12px;align-items:center;background:#fff;border:2.5px solid #141414;border-radius:16px;padding:12px 14px;box-shadow:4px 4px 0 #141414}
.step .n{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;border:2.5px solid #141414}
.step b{display:block;font-size:15.5px}.step span{font-size:13.5px;color:#4a3f2a}
.cue{font-family:Caveat,cursive;font-weight:700;font-size:clamp(24px,6vw,34px);line-height:1;margin:22px 0 16px;display:flex;align-items:flex-end;gap:8px;color:#141414}
.cue svg{width:54px;height:46px;flex:none;color:#FF4D8D;align-self:center}
.cuesub{font-size:14px;color:#5b4b2a;margin:12px 0 20px}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{position:relative;text-align:left;border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:#222;border:3px solid #141414;display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:6px 6px 0 var(--c,#141414);transform:rotate(var(--r,0deg));transition:transform .15s ease,box-shadow .15s}
.card:hover{transform:rotate(0) translate(-2px,-3px);box-shadow:9px 9px 0 var(--c,#141414)}
.card:active{transform:rotate(0) translate(3px,3px);box-shadow:2px 2px 0 var(--c,#141414)}
.card:focus-visible{outline:3px solid #2F6BFF;outline-offset:3px}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .shade2{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 18%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.9) 72%)}
.card .doodle{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:13px;background:var(--c);border:2.5px solid #141414;display:grid;place-items:center;transform:rotate(8deg);box-shadow:2px 2px 0 #141414}
.card .doodle svg{width:24px;height:24px}
.card .ct{position:relative;padding:12px;color:#fff}
.card .cn{font-weight:800;font-size:17px;line-height:1.1;letter-spacing:-.3px}
.card .cw{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:4px;line-height:1.3}
.card .cc{display:inline-block;margin-top:9px;font-size:12px;font-weight:800;color:#141414;padding:4px 9px;border-radius:999px;background:var(--c);border:2px solid #141414}
.card.wide{grid-column:1/-1;aspect-ratio:auto;min-height:96px;justify-content:center;background:#141414;--r:0deg}
.card.wide .ct{display:flex;align-items:center;gap:14px}
.card.sv{background:#FF4D8D}.card.sv .cn,.card.sv .cw{color:#141414}
.svic{width:46px;height:46px;flex:none;border-radius:13px;background:#fff;border:2.5px solid #141414;box-shadow:3px 3px 0 #141414;display:grid;place-items:center;transform:rotate(-6deg)}.svic svg{width:24px;height:24px}
.mixdots{display:flex;flex:none}.mixdots i{width:22px;height:22px;border-radius:50%;border:2.5px solid #141414;margin-left:-7px}.mixdots i:first-child{margin-left:0}
.hfoot{margin-top:30px;font-size:13px;color:#5b4b2a;text-align:center}
.hfoot b{font-family:Caveat,cursive;font-size:19px}
@media (min-width:760px){
  .hero{grid-template-columns:1.15fr .85fr;gap:30px}.phone{width:270px}
  .steps{grid-template-columns:repeat(3,1fr)}
  .hgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{aspect-ratio:5/4}
  #home{padding-top:30px}}
.mix{flex:none;width:40px;height:40px;border-radius:50%;background:#1b1b1f;display:grid;place-items:center}
.mix svg{width:18px;height:18px}
.mix{position:relative}
.mix .spd{position:absolute;right:-6px;top:-5px;background:#ff3b5c;color:#fff;font-weight:800;font-size:10px;line-height:1;padding:3px 5px;border-radius:999px;border:2px solid #000}
.mixpop .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:4px;padding:0 2px}
.mixpop{position:fixed;z-index:12;top:calc(var(--topH) + 6px);right:max(10px,calc(50vw - 270px));width:236px;background:#16161a;border:1px solid #2a2a30;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mixpop label{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:8px}
.mixpop label span{color:var(--dim);font-weight:600}
.mixpop input{width:100%;accent-color:#ff3b5c}
.mixpop p{margin:8px 0 0;font-size:11.5px;color:var(--dim);line-height:1.35}
.hint{position:absolute;left:50%;bottom:14px;transform:translate(-50%,12px);z-index:3;display:flex;gap:8px;align-items:center;padding:9px 15px;border-radius:999px;
  background:rgba(255,255,255,.94);color:#111;font-weight:800;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap}
.hint.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;animation:nudge 1.6s ease-in-out .4s infinite}
.hint svg{width:16px;height:16px}
@keyframes nudge{0%,100%{translate:0 0}50%{translate:0 -5px}}
.back{flex:none;align-self:center;width:40px;height:40px;border-radius:50%;background:#1b1b1f;display:grid;place-items:center;margin-right:2px}
.back svg{width:18px;height:18px}
.brand{cursor:pointer}
</style>
</head>
<body>
<main id="home" aria-label="Sloppy Studies home"><div class="hwrap">
  <nav class="hnav"><div class="logo"><span class="blob"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span><div>Sloppy Studies<small>by Aniket Shaw</small></div></div><a class="gh" href="https://github.com/aniketshaw748-hub/sloppy-studies" target="_blank" rel="noopener" aria-label="Star Sloppy Studies on GitHub" onclick="AN.t('github')"><svg viewBox="0 0 24 24" fill="#141414" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg><span class="st">★</span>Star</a></nav>
  <h1 class="h1">Studying, turned into <span class="mark">reels</span> you can <span class="scrolly">scroll.</span></h1>
  <h2 class="cue">Pick any subject and keep scrolling <svg viewBox="0 0 62 52" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c18-6 40 0 44 20 2 9-1 15-5 20"/><path d="M33 38l10 9 8-12"/></svg></h2>
  <div class="hgrid" id="hgrid"></div>
  <p class="hfoot">made for the CA2 crunch &middot; <b>good luck, you have got this</b></p>
</div></main>
<div id="app"><div id="feed" aria-label="Exam reels feed"></div></div>
<nav class="top" id="tabs" aria-label="Subjects"></nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="Exam answer notes"><div class="grab"></div><h3 id="sh-t"></h3><p class="sq" id="sh-q"></p><ol id="sh-a"></ol></section>
<section class="sheet csheet" id="csheet" role="dialog" aria-label="Feedback on this reel"><div class="grab"></div><h3>Feedback <span class="tc" id="c-at"></span></h3>
  <textarea id="c-tx" maxlength="1000" rows="4" aria-label="Your feedback" placeholder="What should change here? A mistake, something unclear, too fast..."></textarea>

    const last=!el.nextElementSibling; hint.querySelector("span").textContent=last?"That was the last one. Back to subjects":"Scroll for the next question";
    hint.classList.toggle("show", v.currentTime>=hintAt() && v.currentTime < (v.duration||1e9)-0.3 || (last&&v.currentTime>=hintAt()));
    if(!hintLogged&&hint.classList.contains("show")){ hintLogged=true; AN.t("hint_shown",{r:s.id,s:s.subject,v:+v.currentTime.toFixed(1)}); }
    if(v===activeV) bedSync(); });
  ["play","pause","seeked","ratechange"].forEach(ev=>v.addEventListener(ev,()=>{ if(v===activeV) bedSync(ev!=="pause"); }));

  el.querySelector(".like").onclick=e=>like(s,el,!likes[s.id],e);
  el.querySelector(".notes").onclick=()=>openSheet(s);
  el.querySelector(".cmt").onclick=()=>openComment(s,el,v);
  return el;}
function like(s,el,on,e){const was=!!likes[s.id];likes[s.id]=on;store.set("likes",likes);if(was!==on) LC[s.id]=Math.max(0,(LC[s.id]||0)+(on?1:-1));
  const b=el.querySelector(".like");b.classList.toggle("on",on);b.querySelector("span").textContent=likeTxt(s.id);
  if(on&&e&&e.currentTarget&&e.currentTarget.tagName==="VIDEO"||on&&e&&e.type==="click"&&e.target.tagName==="VIDEO"){const r=el.getBoundingClientRect(),h=document.createElement("div");h.className="burst";h.style.left=(e.clientX-r.left)+"px";h.style.top=(e.clientY-r.top)+"px";h.innerHTML=ICON.heart.replace('stroke="#fff"','stroke="#ff3b5c" fill="#ff3b5c"');el.appendChild(h);setTimeout(()=>h.remove(),800);}
  if(was!==on){ AN.t(on?"like":"unlike",{r:s.id,s:s.subject}); toast(on?"Added to Liked videos":"Removed from Liked videos"); }}
let sheetOpen=null;
function openSheet(s){ sheetOpen={r:s.id,s:s.subject,at:Date.now()};document.getElementById("sh-t").textContent=s.title;document.getElementById("sh-q").textContent="Q"+s.qno+". "+s.question;
  const ol=document.getElementById("sh-a");ol.innerHTML="";s.answer.forEach(a=>{const li=document.createElement("li");li.textContent=a;ol.appendChild(li)});
  document.getElementById("sheet").classList.add("open");document.getElementById("scrim").classList.add("open");AN.t("answer_open",{r:s.id,s:s.subject});}
function togglePop(){ let pop=document.getElementById("mixpop");
  if(pop){ pop.remove(); return; }
  pop=document.createElement("div"); pop.id="mixpop"; pop.className="mixpop";
  const row=(k,name)=>`<label for="r-${k}">${name} <span id="v-${k}">${Math.round(LV[k]*100)}%</span></label>
    <input id="r-${k}" type="range" min="0" max="100" step="1" value="${Math.round(LV[k]*100)}">`;
  const fx=v=>(v%1?v:v.toFixed(0))+"×";
  pop.innerHTML=`<label for="r-speed">Speed <span id="v-speed">${fx(SPEED)}</span></label>
    <input id="r-speed" type="range" min="1" max="4" step="0.25" value="${SPEED}">
    <div class="ticks"><span>1×</span><span>2×</span><span>3×</span><span>4×</span></div><div style="height:14px"></div>`
    +row("music","Music")+`<div style="height:12px"></div>`+row("sfx","Sound effects")+`<p>The voice stays the same. Slide left to make music or effects quieter, all the way left to turn them off.</p>`;
  document.body.appendChild(pop);
  const rsp=pop.querySelector("#r-speed");
  rsp.onchange=()=>AN.t("speed",{v:SPEED,r:activeS&&activeS.id,s:activeS&&activeS.subject});
  rsp.oninput=()=>{ SPEED=+rsp.value; store.set("speed",SPEED); pop.querySelector("#v-speed").textContent=fx(SPEED); applySpeed(); bedSync(true); };
  for(const k of ["music","sfx"]){ const r=pop.querySelector("#r-"+k);
    r.onchange=()=>AN.t(k,{v:LV[k]});
    r.oninput=()=>{ LV[k]=r.value/100; store.set(k+"Level",LV[k]); pop.querySelector("#v-"+k).textContent=r.value+"%"; ensureAudio(); applyBed(); bedSync(); }; }
  setTimeout(()=>addEventListener("click",function close(ev){ if(!pop.contains(ev.target)){ pop.remove(); removeEventListener("click",close); } }),0); }
// feedback: pause, tag the current video time, POST it to /api/comment (text goes in the body, never in a URL)
let cmt=null; const fmtT=t=>Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
function openComment(s,el,v){ cmt={s,el,v,t:v.currentTime,play:!v.paused}; v.pause(); el.querySelector(".paused").classList.add("show");
  document.getElementById("c-at").textContent="at "+fmtT(cmt.t);
  document.getElementById("csheet").classList.add("open"); document.getElementById("scrim").classList.add("open"); document.getElementById("c-tx").focus(); }
function closeComment(){ if(!cmt) return; const {el,v,play}=cmt; cmt=null; document.getElementById("c-tx").blur();
  document.getElementById("csheet").classList.remove("open"); document.getElementById("scrim").classList.remove("open");
  if(play){ v.play().catch(()=>{}); el.querySelector(".paused").classList.remove("show"); } }
document.getElementById("c-go").onclick=async()=>{ const tx=document.getElementById("c-tx"), b=document.getElementById("c-go"), text=tx.value.trim();
  if(!cmt) return; if(text.length<2){ tx.focus(); return; }
  b.disabled=true;
  try{ const r=await fetch("/api/comment",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({...AN.who(),r:cmt.s.id,s:cmt.s.subject,t:+cmt.t.toFixed(1),text})});
    if(r.status===429) toast("Too many comments, try again later");
    else if(!r.ok) throw 0;
    else { tx.value=""; closeComment(); toast("Thanks! Feedback sent"); } }
  catch{ toast("Couldn't send, try again"); }
  b.disabled=false; };
// keep the feedback sheet above the on-screen keyboard (phones shrink only the visual viewport)
const VV=window.visualViewport; if(VV){ const lift=()=>{ document.getElementById("csheet").style.bottom=Math.max(0,innerHeight-VV.height-VV.offsetTop)+"px"; };
  VV.addEventListener("resize",lift); VV.addEventListener("scroll",lift); }
document.getElementById("scrim").onclick=()=>{ closeComment(); if(sheetOpen){ AN.t("answer_close",{r:sheetOpen.r,s:sheetOpen.s,v:+((Date.now()-sheetOpen.at)/1000).toFixed(1)}); sheetOpen=null; }document.getElementById("sheet").classList.remove("open");document.getElementById("scrim").classList.remove("open")};
let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(en=>{const v=en.target.querySelector("video");
  if(en.isIntersecting&&en.intersectionRatio>.6){v.currentTime=startAt(en.target.id.slice(2));v.muted=muted;v.play().catch(e=>{ if(e.name!=="NotAllowedError") return; v.muted=true; v.play().catch(()=>{}); });en.target.querySelector(".paused").classList.remove("show"); const sid=en.target.id.slice(2); const S=all.find(x=>x.id===sid); if(S){ bedFor(S,v); AN.t("reel_view",{r:S.id,s:S.subject,v2:SPEED}); }history.replaceState({view:"feed"},"","#"+en.target.id.slice(2));
    const nx=en.target.nextElementSibling;nx&&nx.querySelector("video")&&(nx.querySelector("video").preload="auto");}
  else { v.pause(); const h=en.target.querySelector(".hint"); h&&h.classList.remove("show"); if(v===activeV) bedPause(); } }),{root:feed,threshold:[0,.6,1]});document.querySelectorAll(".reel").forEach(r=>io.observe(r));}
addEventListener("keydown",e=>{ if(!home.hidden) return; if(e.target.tagName==="TEXTAREA"){ if(e.key==="Escape") closeComment(); return; } if(e.key==="Escape"){ goHome(); return; } if(e.key==="ArrowDown"||e.key==="j"){feed.scrollBy({top:feed.clientHeight,behavior:"smooth"})}if(e.key==="ArrowUp"||e.key==="k"){feed.scrollBy({top:-feed.clientHeight,behavior:"smooth"})}
  if(e.key===" "){e.preventDefault();const r=[...document.querySelectorAll(".reel")].find(x=>Math.abs(x.getBoundingClientRect().top)<50);r&&r.querySelector("video").click()}});
